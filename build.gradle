plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // ========== Spring Boot Core Starters ==========
    implementation 'org.springframework.boot:spring-boot-starter-web'              // REST API, JSON, Tomcat
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'         // Database + Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-validation'       // 👈 NEW: @Valid, @NotNull, @NotBlank

    // ========== API Documentation ==========
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'       // Swagger UI (/swagger-ui.html)

    // ========== Database Driver ==========
    runtimeOnly 'org.postgresql:postgresql'                                        // PostgreSQL driver (runtime only)

    // ========== Lombok ==========
    compileOnly 'org.projectlombok:lombok'                                         // For main code
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'                                     // For test code
    testAnnotationProcessor 'org.projectlombok:lombok'

    // ========== Testing ==========
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}